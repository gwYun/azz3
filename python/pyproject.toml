[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valuetrack"
version = "0.1.0"
description = "ValueTrack — soccer transfer-fee model, sim engine + apps, and the KBO baseball pipeline."
requires-python = ">=3.9"          # the project venv is CPython 3.9.6
dependencies = [
  "rdata>=0.11,<1.0",
  "pandas>=2.1,<3.0",
  "numpy>=1.26,<3.0",
  "xgboost>=2.0,<3.0",
  "scikit-learn>=1.4,<2.0",
  "shap>=0.45,<1.0",
  "rapidfuzz>=3.6,<4.0",
  "pyarrow>=15.0,<22.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "jupyter>=1.0,<2.0", "matplotlib>=3.8,<4.0"]

# Flat-layout: core, soccer.*, kbo.* are importable top-level packages.
# data/, predictions/, tests/ are deliberately excluded (they are not packages).
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "soccer*", "kbo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
